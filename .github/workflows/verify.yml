name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Syntax and shell
        run: |
          python -m compileall -q ./*.py tests tools
          bash -n install.sh
          bash -n install_app.sh
          shellcheck install.sh install_app.sh
      - name: Portable regression tests
        run: |
          python -m pip install --require-hashes -r bootstrap.lock
          python -m pip install --require-hashes -r requirements-portable.lock
          python -m pip check
          python -m pytest -q tests/test_state_and_audio.py tests/test_transcription.py tests/test_recovery.py tests/test_hotkey_and_injection.py tests/test_permissions.py tests/test_installer.py
      - run: python tools/audit_dependencies.py
      - name: Scan tracked Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts=--all .

  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select native Apple Silicon framework Python
        run: |
          brew list python@3.12 >/dev/null || brew install python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify native dependencies
        run: |
          python -c 'import platform; assert platform.machine() == "arm64"'
          python -m pip install --require-hashes -r bootstrap.lock
          python -m pip install --require-hashes -r build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-dev.lock
          python -m pip check
      - name: Controlled native and regression tests
        run: python -m pytest -q -rs
      - name: Build and verify the local alias bundle
        run: |
          python setup.py py2app -A
          python prepare_bundle.py dist/VoiceToText.app
          codesign --force --sign - dist/VoiceToText.app/Contents/MacOS/python3.12
          codesign --force --sign - dist/VoiceToText.app
          codesign --verify --strict --deep dist/VoiceToText.app
          fingerprint="$(python -c 'from buildinfo import source_fingerprint; print(source_fingerprint()[:16])')"
          actual="$(dist/VoiceToText.app/Contents/MacOS/VoiceToText --check-bundle)"
          test "$actual" = "$fingerprint"
